<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cansuyu KOBİ - Türkiye'deki KOBİ ve girişimciler için merkezi destek, hibe ve teşvik haritası.">
    <title>Cansuyu KOBİ - Ekosistem Haritası</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    <div class="container">
        <header>
            <h1>Cansuyu <span class="highlight">KOBİ</span></h1>
            <p>Türkiye'deki KOBİ ve girişimciler için merkezi destek ve ekosistem haritası.</p>
        </header>

        <section class="filters">
            <input type="text" id="searchInput" placeholder="Destek ara (örn: ar-ge, fuar, kosgeb)...">
            <div class="category-filters" id="categoryFilters">
                <!-- Categories will be injected here -->
            </div>
        </section>

        <main id="destekListesi" class="grid-container">
            <!-- Cards will be injected here -->
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
